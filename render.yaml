# Render Blueprint — 100% free-tier deployment.
# BullMQ workers run in-process with the API (WORKERS_IN_PROCESS=true).
# If you later upgrade, add a dedicated worker service with
# dockerCommand: node dist/queues/workers/index.js and set WORKERS_IN_PROCESS=false here.
#
# Set the `sync: false` values in the Render dashboard when prompted:
#   DATABASE_URL  → Neon POOLED connection string (-pooler host)
#   REDIS_URL     → Upstash rediss:// URL
#   S3_*          → Supabase Storage S3 credentials
services:
  - type: web
    name: chat-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGIN
        value: "*"
      - key: WORKERS_IN_PROCESS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: chat-uploads
      - key: S3_FORCE_PATH_STYLE
        value: "true"
